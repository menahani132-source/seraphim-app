    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

      background: #FBF7F0;
    }
    ::-webkit-scrollbar-thumb {
      background: #DFCBB0;
      border-radius: 9999px;
    }

    /* QR Scanner Laser Animation */
    @keyframes scanline {
      0% { top: 10%; opacity: 0.2; }
      50% { top: 85%; opacity: 1; }
      100% { top: 10%; opacity: 0.2; }
    }
    .scanner-laser {
      animation: scanline 2.4s ease-in-out infinite;
    }

    /* Wheel Spin Smooth Transition */
    .wheel-transition {
      transition: transform 4.2s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    /* Audio Wave Pulse */
    @keyframes pulseBar {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    .wave-bar {
      animation: pulseBar 0.8s ease-in-out infinite;

          tasks: []

      // Empty Notifications List (0 unread)
      notifications: []

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {
        console.warn('Could not load state from localStorage', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Could not save state', e);
      }
    }

    function getLogoHTML(sizeClass = 'w-24 h-24') {
      const tpl = document.getElementById('seraphim-logo-tpl');
      return `<div class="${sizeClass} rounded-full overflow-hidden shadow-sm border border-brand-goldBorder bg-white flex items-center justify-center shrink-0">${tpl.innerHTML}</div>`;
    }

    function getAvatarHTML(sizeClass = 'w-20 h-20 text-2xl') {
      const trimmedName = (state.user.name || '').trim();
      const firstChar = trimmedName ? trimmedName.charAt(0) : '';
      if (state.user.avatar) {
        return `<img src="${state.user.avatar}" alt="صورة الطالب" class="${sizeClass} rounded-full object-cover border-[3px] border-brand-gold shadow-sm" />`;
      }
      return `
        <div class="${sizeClass} rounded-full border-[3px] border-brand-gold bg-cream-soft flex items-center justify-center font-extrabold text-brand-brown shadow-inner">
          ${firstChar || '<i class="fa-regular fa-user text-stone-400"></i>'}
        </div>
      `;
    }

    function getUnreadCount() {
      return Array.isArray(state.notifications) ? state.notifications.filter(n => n.unread).length : 0;
    }

    function calculateAge(birthDateStr) {
      if (!birthDateStr) return null;
      const diff = Date.now() - new Date(birthDateStr).getTime();
      const age = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
      return age >= 0 ? age : null;
    }

    function showToast(msg, iconClass = 'fa-circle-check text-brand-gold') {
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-text');
      const icon = document.getElementById('toast-icon');
      text.textContent = msg;
      icon.className = `fa-solid ${iconClass}`;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 3000);
    }

    function openModal(innerHTML) {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      content.innerHTML = innerHTML;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function navigate(screen) {
      state.currentScreen = screen;
      saveState();
      render();
      document.getElementById('screen-container').scrollTop = 0;
    }

              </button>
            </div>
          ` : ''}

            ${getLogoHTML('w-24 h-24 mb-3')}
            <h1 class="text-xl font-extrabold text-brand-brown tracking-tight">مدرسة السيرافيم</h1>
            <p class="text-sm font-bold text-brand-gold mt-0.5">للألحان والتسبحة الكنسية</p>
            <div class="inline-flex items-center gap-1.5 text-xs text-stone-600 mt-1.5 bg-white px-3 py-1 rounded-full border border-brand-goldBorder/70">
              <i class="fa-solid fa-church text-brand-gold"></i>
              <span>كنيسة السيدة العذراء مريم بالمنشاة</span>
            </div>
          </div>

          <!-- Auth Mode Tabs -->
          <div class="w-full bg-cream-soft p-1.5 rounded-2xl grid grid-cols-2 gap-1.5 mb-4 border border-brand-goldBorder/50">
            <button onclick="switchAuthTab('register')" class="py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${!isLogin ? 'bg-brand-brown text-white shadow' : 'text-brand-brown hover:bg-white/60'}">
              <i class="fa-solid fa-user-plus"></i>
              <span>انضمام للمدرسة</span>
            </button>
            <button onclick="switchAuthTab('login')" class="py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${isLogin ? 'bg-brand-brown text-white shadow' : 'text-brand-brown hover:bg-white/60'}">
              <i class="fa-solid fa-right-to-bracket"></i>
              <span>دخول</span>
            </button>
          </div>

          <!-- Form Card -->

            <p class="text-xs font-bold text-brand-gold text-center mb-2">

            <form onsubmit="handleManualCode(event)" class="flex items-center gap-2">

    /**
     * ============================================================================
     * SCREEN 4: RECITATION & EVALUATION
     * ============================================================================
     */
    function renderRecitationScreen() {
      const sub = state.subjects[state.activeSubjectId];
      const filter = state.recitationFilter;

      const filteredTasks = sub.tasks.filter(t => {
        if (filter === 'available') return t.status === 'available';
        if (filter === 'closed') return t.status !== 'available';
        return true;
      });

      return `
        ${renderSubHeader('التسميع والاختبارات')}
        <div class="p-4 space-y-4">
          <!-- Closest Deadline Alert -->
          <div class="bg-cream-goldLight/60 border border-brand-goldBorder rounded-2xl p-3.5 flex items-center justify-between">
            <div>
              <p class="text-xs font-extrabold text-brand-brown">سجل التسميع والاختبارات جديد</p>
              <p class="text-[11px] font-semibold text-stone-600 mt-0.5">لم يتم إضافة مهام تسميع أو رصد درجات بعد</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-white border border-brand-goldBorder text-brand-gold flex items-center justify-center">
              <i class="fa-regular fa-calendar-check"></i>
            </div>
          </div>

          <!-- Subject Tabs Grid -->
          <div>
            <h2 class="text-xs font-extrabold text-brand-brown mb-2">اختر المادة لعرض التسميعات والاختبارات:</h2>
            <div class="grid grid-cols-2 gap-2.5">
              ${Object.values(state.subjects).map(s => {
                const active = s.id === state.activeSubjectId;
                return `
                  <button onclick="selectRecitationSubject('${s.id}')" class="p-3.5 rounded-2xl border text-right transition flex flex-col justify-between ${active ? 'bg-white border-2 border-brand-gold shadow-sm' : 'bg-white/70 border-brand-goldBorder/60 hover:bg-white'}">
                    <div class="flex items-center justify-between mb-2">
                      <div class="w-8 h-8 rounded-xl ${active ? 'bg-brand-brown text-white' : 'bg-cream-soft text-brand-brown'} flex items-center justify-center text-xs">
                        <i class="fa-solid ${s.icon}"></i>
                      </div>
                      <span class="text-[10px] font-bold text-brand-gold">المهام (${s.tasks.length})</span>
                    </div>
                    <p class="text-xs font-extrabold text-brand-brown">${s.name}</p>
                    <p class="text-[10px] text-stone-500 line-clamp-1 mt-0.5">${s.subtitle}</p>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Active Subject Tasks Section -->
          <div class="bg-white border border-brand-goldBorder rounded-3xl p-4 shadow-card space-y-3">
            <div class="flex items-center justify-between border-b border-cream-soft pb-3">
              <div>
                <h3 class="text-sm font-extrabold text-brand-brown">تسميعات مادة ${sub.name}</h3>
                <p class="text-[11px] text-stone-500">تسليم التسجيلات الصوتية ومتابعة التقييم</p>
              </div>
              <div class="w-10 h-10 rounded-2xl bg-brand-brown text-white flex items-center justify-center">
                <i class="fa-solid ${sub.icon}"></i>
              </div>
            </div>

            <!-- Filter Buttons -->
            <div class="grid grid-cols-3 gap-1.5 bg-cream-soft p-1 rounded-xl text-[11px] font-bold">
              <button onclick="setRecitationFilter('all')" class="py-1.5 rounded-lg transition ${filter === 'all' ? 'bg-brand-brown text-white' : 'text-brand-brown'}">الكل</button>
              <button onclick="setRecitationFilter('available')" class="py-1.5 rounded-lg transition ${filter === 'available' ? 'bg-brand-brown text-white' : 'text-brand-brown'}">المتاحة فقط</button>
              <button onclick="setRecitationFilter('closed')" class="py-1.5 rounded-lg transition ${filter === 'closed' ? 'bg-brand-brown text-white' : 'text-brand-brown'}">المكتملة والمغلقة</button>
            </div>

            <!-- Tasks List -->
            <div class="space-y-3 pt-1">
              ${filteredTasks.length === 0 ? `
                <div class="text-center py-8 px-3 bg-cream-bg/60 rounded-2xl border border-dashed border-brand-goldBorder">
                  <i class="fa-solid fa-microphone-slash text-stone-300 text-2xl mb-2"></i>
                  <p class="text-xs font-bold text-stone-500">لا توجد مهام تسميع أو درجات مسجلة حالياً في مادة ${sub.name}</p>
                  <p class="text-[10px] text-stone-400 mt-1">سيتم عرض المهام فور إضافتها من إدارة المدرسة أو الخدام</p>
                </div>
              ` : filteredTasks.map(task => `
                <div class="border ${task.status === 'available' ? 'border-brand-gold bg-cream-bg/50' : 'border-brand-goldBorder/70 bg-white'} rounded-2xl p-3.5 space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <h4 class="text-xs font-extrabold text-brand-brown leading-relaxed">${task.title}</h4>

                      <span class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-extrabold px-2.5 py-0.5 rounded-full shrink-0">
                        <i class="fa-regular fa-circle-check ml-1"></i>الدرجة: ${task.score}
                      </span>
                    ` : `
                      <span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full shrink-0">
                        متاح الآن
                      </span>
                    `}
                  </div>

                  <p class="text-[11px] text-stone-500">${task.dueDate}</p>

                  ${task.status === 'available' ? `
                    <button onclick="openRecitationRecorder('${sub.id}', '${task.id}')" class="w-full bg-brand-brown hover:bg-brand-brownDark text-white text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 shadow transition">
                      <i class="fa-solid fa-microphone"></i>
                      <span>تسجيل وإرسال التسميع الصوتي</span>
                    </button>
                  ` : `
                    <div class="w-full bg-stone-100 text-stone-500 text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5 border border-stone-200">
                      <i class="fa-solid fa-lock text-[11px]"></i>
                      <span>${task.status === 'completed' ? 'تم استهلاك المحاولة والتقييم' : 'انتهى الموعد'}</span>
                    </div>
                  `}

                  <div class="text-[10px] text-stone-400 flex items-center gap-1 pt-0.5">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>${task.weekLabel}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

                <button onclick="selectRecitationSubject('${s.id}')" class="bg-white rounded-3xl p-4 border ${active ? 'border-2 border-brand-gold shadow-md' : 'border-brand-goldBorder/70'} flex flex-col items-center text-center transition">

                    </div>

                      <p class="text-xs font-extrabold text-brand-brown truncate">${mat.title}</p>

    /**
     * ============================================================================
     * SCREEN 8: PROFILE (بياناتي)
     * ============================================================================
     */
    function renderProfileScreen() {

      const displayName = (state.user.name || '').trim() || 'لم يُدخل الاسم بعد';

      const grades = ['حضانة', 'أولى وتانية', 'تالتة ورابعة', 'خامسة وستة', 'إعدادي', 'ثانوي', 'جامعة'];

      return `

          <!-- Avatar & Name Header -->
          <div class="flex flex-col items-center text-center pt-1">

              <h3 class="text-xs font-extrabold text-brand-brown">البيانات الشخصية</h3>
            </div>

            <!-- Full Name -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-regular fa-user ml-1.5 text-brand-gold"></i>الاسم الكامل</span>
              <input id="prof-name" type="text" value="${state.user.name}" placeholder="غير مسجل" class="text-xs font-extrabold text-brand-brown text-left bg-transparent focus:bg-cream-soft px-2 py-1 rounded-lg focus:outline-none w-full" />
            </div>

            <!-- Phone -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-solid fa-phone ml-1.5 text-brand-gold"></i>رقم الهاتف</span>
              <div class="flex items-center gap-1.5">

                </button>
              </div>
            </div>

            <!-- WhatsApp -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-brands fa-whatsapp ml-1.5 text-emerald-600"></i>رقم الواتساب</span>
              <div class="flex items-center gap-1.5">
                <input id="prof-whatsapp" type="tel" value="${state.user.whatsapp}" placeholder="غير مسجل" class="text-xs font-extrabold text-brand-brown text-left bg-transparent focus:bg-cream-soft px-2 py-1 rounded-lg focus:outline-none w-28" dir="ltr" />
              </div>
            </div>

            <!-- Parent Phone -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-solid fa-users ml-1.5 text-brand-gold"></i>رقم ولي الأمر</span>
              <input id="prof-parent" type="tel" value="${state.user.parentPhone}" placeholder="غير مسجل" class="text-xs font-extrabold text-brand-brown text-left bg-transparent focus:bg-cream-soft px-2 py-1 rounded-lg focus:outline-none w-28" dir="ltr" />
            </div>

            <!-- Birth Date -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-solid fa-cake-candles ml-1.5 text-brand-gold"></i>تاريخ الميلاد</span>
              <div class="flex items-center gap-1.5">
                ${age !== null ? `<span class="text-[10px] text-stone-400">(${age} سنة)</span>` : ''}
                <input id="prof-birth" type="date" value="${state.user.birthDate}" class="text-xs font-extrabold text-brand-brown bg-transparent focus:bg-cream-soft px-1.5 py-1 rounded-lg focus:outline-none" dir="ltr" />
              </div>
            </div>

            <!-- Gender -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-solid fa-venus-mars ml-1.5 text-brand-gold"></i>الجنس</span>
              <span class="text-xs font-extrabold text-brand-brown">${state.user.gender || 'غير محدد'}</span>
            </div>

            <!-- Ecclesiastical Rank -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-solid fa-church ml-1.5 text-brand-gold"></i>الرتبة الكنسية</span>
              <select id="prof-rank" class="bg-cream-goldLight/70 border border-brand-goldBorder text-brand-brown text-xs font-extrabold px-2.5 py-1 rounded-xl focus:outline-none">
                <option value="" ${!state.user.rank ? 'selected' : ''}>غير محدد</option>
                ${ranks.map(r => `<option value="${r}" ${r === state.user.rank ? 'selected' : ''}>${r}</option>`).join('')}
              </select>
            </div>

            <!-- Grade -->
            <div class="flex items-center justify-between py-1.5 border-b border-cream-soft/80 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-solid fa-graduation-cap ml-1.5 text-brand-gold"></i>الفصل الدراسي</span>
              <select id="prof-grade" class="bg-cream-soft border border-brand-goldBorder text-brand-brown text-xs font-extrabold px-2.5 py-1 rounded-xl focus:outline-none">
                <option value="" ${!state.user.grade ? 'selected' : ''}>غير محدد</option>
                ${grades.map(g => `<option value="${g}" ${g === state.user.grade ? 'selected' : ''}>${g}</option>`).join('')}
              </select>
            </div>

            <!-- Password Row -->
            <div class="flex items-center justify-between py-1.5 gap-2">
              <span class="text-xs font-bold text-stone-500 shrink-0"><i class="fa-solid fa-lock ml-1.5 text-brand-gold"></i>كلمة المرور</span>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-stone-400">${state.user.password ? '••••••••' : 'غير محددة'}</span>
                <button type="button" onclick="openChangePasswordModal()" class="bg-brand-brown hover:bg-brand-brownDark text-white text-[11px] font-bold px-3 py-1 rounded-lg transition">
                  تغيير
                </button>
              </div>
            </div>

            <button type="submit" class="w-full bg-brand-brown hover:bg-brand-brownDark text-white font-bold text-xs py-3.5 rounded-2xl shadow-md flex items-center justify-center gap-2 transition mt-2">
              <i class="fa-regular fa-circle-check"></i>
              <span>حفظ التعديلات</span>
            </button>
          </form>
        </div>
      `;
    }

    /**
     * ============================================================================
     * INTERACTIVE HANDLERS & MODALS
     * ============================================================================
     */
    function switchAuthTab(tab) {
      state.authTab = tab;
      render();
    }

    function togglePasswordVisibility(inputId, btn) {
      const inp = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function selectGender(g) {
      document.getElementById('reg-gender').value = g;
      const maleBtn = document.getElementById('btn-gender-male');
      const femaleBtn = document.getElementById('btn-gender-female');
      if (g === 'ذكر') {
        maleBtn.className = 'py-2.5 rounded-xl border-2 border-brand-gold bg-cream-goldLight/60 text-brand-brown text-xs font-bold flex items-center justify-center gap-1.5';
        femaleBtn.className = 'py-2.5 rounded-xl border border-brand-goldBorder bg-cream-soft/60 text-stone-600 text-xs font-bold flex items-center justify-center gap-1.5';
      } else {
        femaleBtn.className = 'py-2.5 rounded-xl border-2 border-brand-gold bg-cream-goldLight/60 text-brand-brown text-xs font-bold flex items-center justify-center gap-1.5';
        maleBtn.className = 'py-2.5 rounded-xl border border-brand-goldBorder bg-cream-soft/60 text-stone-600 text-xs font-bold flex items-center justify-center gap-1.5';
      }
    }

    function syncWhatsappIfChecked() {
      const same = document.getElementById('reg-same-wa')?.checked;
      const phone = document.getElementById('reg-phone')?.value || '';
      const wa = document.getElementById('reg-whatsapp');
      if (same && wa) {
        wa.value = phone;
      }
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        state.user.avatar = ev.target.result;
        const preview = document.getElementById('reg-avatar-preview');
        if (preview) preview.innerHTML = getAvatarHTML('w-20 h-20 text-2xl');
      };
      reader.readAsDataURL(file);
    }

    function handleProfileAvatarChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        state.user.avatar = ev.target.result;
        saveState();
        render();
        showToast('تم تحديث الصورة الشخصية');
      };
      reader.readAsDataURL(file);
    }

    function handleRegister(e) {
      e.preventDefault();
      state.user.name = document.getElementById('reg-name').value.trim();
      state.user.gender = document.getElementById('reg-gender').value;
      state.user.rank = document.getElementById('reg-rank').value;
      state.user.grade = document.getElementById('reg-grade').value;
      state.user.phone = document.getElementById('reg-phone').value.trim();
      state.user.whatsapp = document.getElementById('reg-whatsapp').value.trim() || state.user.phone;
      state.user.parentPhone = document.getElementById('reg-parent').value.trim();
      state.user.birthDate = document.getElementById('reg-birth').value;
      state.user.password = document.getElementById('reg-password').value;
      state.user.status = 'pending';
      state.pendingApprovalBanner = true;
      saveState();

      openModal(`
        <div class="text-center space-y-3 py-2">
          <div class="w-16 h-16 rounded-full bg-amber-100 text-brand-gold flex items-center justify-center mx-auto text-2xl">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <h3 class="text-base font-extrabold text-brand-brown">تم استلام طلبك بنجاح!</h3>
          <p class="text-xs text-stone-600 leading-relaxed">
            طلب الانضمام إلى <strong>مدرسة السيرافيم</strong> قيد المراجعة لدى إدارة المدرسة والآباء الكهنة. سيتم التواصل معك عبر الواتساب فور اعتماده.
          </p>
          <div class="pt-2 space-y-2">
            <button onclick="closeModal(); switchAuthTab('login');" class="w-full bg-brand-brown text-white text-xs font-bold py-3 rounded-2xl shadow">
              العودة لصفحة الدخول
            </button>
            <button onclick="simulateAdminApproval()" class="w-full bg-emerald-50 border border-emerald-200 text-emerald-800 text-[11px] font-bold py-2.5 rounded-xl hover:bg-emerald-100 transition">
              <i class="fa-solid fa-user-check ml-1"></i>محاكاة موافقة الإدارة وتفعيل الحساب فوراً
            </button>
          </div>
        </div>
      `);
    }

    function simulateAdminApproval() {
      state.user.status = 'active';
      state.pendingApprovalBanner = false;
      saveState();
      closeModal();
      openModal(`
        <div class="text-center space-y-3 py-3">
          <div class="w-16 h-16 rounded-full bg-emerald-700 text-white flex items-center justify-center mx-auto text-2xl shadow">
            <i class="fa-solid fa-check"></i>
          </div>
          <h3 class="text-lg font-extrabold text-emerald-800">تم التفعيل</h3>
          <p class="text-xs text-stone-600">حسابك في مدرسة السيرافيم بالمنشاة جاهز للدخول الآن.</p>
          <button onclick="closeModal(); navigate('home');" class="w-full bg-brand-brown text-white text-xs font-bold py-3 rounded-2xl mt-2">
            الدخول إلى التطبيق
          </button>
        </div>
      `);
    }

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('login-phone').value.trim();
      const pass = document.getElementById('login-password').value;

      if (state.user.status === 'pending') {
        state.pendingApprovalBanner = true;
        saveState();
        render();
        showToast('حسابك لا يزال قيد المراجعة من الإدارة', 'fa-clock text-amber-300');
        return;
      }

      if (!phone || !pass) {
        showToast('يرجى إدخال رقم الموبايل وكلمة المرور', 'fa-circle-exclamation text-rose-400');
        return;
      }

      if (!state.user.phone) {
        state.user.phone = phone;
        state.user.password = pass;
        saveState();
        navigate('home');
        showToast('تم تسجيل الدخول بنجاح');
        return;
      }

      if (phone === state.user.phone && pass === state.user.password) {
        navigate('home');
      } else {
        showToast('رقم الموبايل أو كلمة المرور غير صحيحة', 'fa-circle-exclamation text-rose-400');
      }
    }

    function quickDemoLogin() {
      state.user.status = 'active';
      state.pendingApprovalBanner = false;
      saveState();
      navigate('home');
      showToast('تم الدخول إلى النسخة الجديدة المصفّرة');
    }

    function logout() {
      navigate('auth');
      showToast('تم تسجيل الخروج');
    }

    function showForgotPasswordModal() {
      openModal(`
        <div class="text-center space-y-3">
          <div class="w-12 h-12 rounded-full bg-cream-goldLight text-brand-gold flex items-center justify-center mx-auto text-lg">
            <i class="fa-solid fa-key"></i>
          </div>
          <h3 class="text-sm font-extrabold text-brand-brown">استعادة كلمة المرور</h3>
          <p class="text-xs text-stone-600 leading-relaxed">
            لإعادة تعيين كلمة المرور، يرجى التواصل مع خادم الفصل أو إدارة مدرسة السيرافيم بكنيسة العذراء بالمنشاة على الرقم:
          </p>
          <p class="text-sm font-extrabold text-brand-brown bg-cream-soft py-2 rounded-xl" dir="ltr">01000000001</p>
          <button onclick="closeModal()" class="w-full bg-brand-brown text-white text-xs font-bold py-2.5 rounded-xl">حسناً</button>
        </div>
      `);
    }

    // Attendance Actions
    function setAttendanceState(newStatus) {
      state.attendance.status = newStatus;
      if (newStatus === 'checked_in' && !state.attendance.checkInTime) {
        state.attendance.checkInTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      }
      saveState();
      render();
    }

    function simulateQrScan() {
      if (state.attendance.status === 'checked_in') {
        showToast('تم تسجيل حضورك اليوم بالفعل!');
        return;
      }
      state.attendance.status = 'checked_in';
      state.attendance.checkInTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      state.user.points += 10;
      saveState();
      render();

      openModal(`
        <div class="text-center space-y-3 py-2">
          <div class="w-14 h-14 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center mx-auto text-2xl">
            <i class="fa-solid fa-certificate"></i>
          </div>
          <h3 class="text-base font-extrabold text-brand-brown">تم تسجيل الحضور بنجاح</h3>
          <p class="text-xs text-stone-600 leading-relaxed">
            تم تسجيل حضورك في الموعد. حصلت على <strong>10 نقاط</strong>.
            <br/>إجمالي نقاطك: <strong class="text-brand-brown">${state.user.points}</strong>
          </p>
          <button onclick="closeModal()" class="w-full bg-brand-brown text-white text-xs font-bold py-3 rounded-2xl mt-2">
            إغلاق
          </button>
        </div>
      `);
    }

    function handleManualCode(e) {
      e.preventDefault();
      const val = document.getElementById('manual-code-input').value.trim();
      if (val.length !== 6) {
        showToast('يرجى إدخال كود مكون من 6 أرقام', 'fa-triangle-exclamation text-amber-300');
        return;
      }
      simulateQrScan();
    }

    function recordCheckOut() {
      if (state.attendance.status === 'pending') {
        showToast('يرجى تسجيل الحضور أولاً قبل الانصراف', 'fa-circle-exclamation text-amber-300');
        return;
      }
      state.attendance.status = 'checked_out';
      state.attendance.checkOutTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      saveState();
      render();
      showToast('تم تسجيل الانصراف بنجاح — نراك الأسبوع القادم!');
    }

    // Recitation & Materials Actions
    function selectRecitationSubject(id) {
      state.activeSubjectId = id;
      saveState();

      disc.style.transform = `rotate(${extraDeg}deg)`;

      const rewards = [
        { text: 'مبروك! فزت بـ +50 نقطة تشجيعية!', pts: 50 },
        { text: 'مبروك! فزت بهدية رمزية من الخادم + 25 نقطة!', pts: 25 },

      ];
      const chosen = rewards[Math.floor(Math.random() * rewards.length)];

      setTimeout(() => {
        if (state.user.spinsAvailable > 0) {
          state.user.spinsAvailable -= 1;
          state.user.spinsUsed += 1;
        }
        state.user.points += chosen.pts;

        resText.innerHTML = `<span class="text-emerald-700 font-extrabold text-sm">${chosen.text}</span>`;

    function copyText(txt) {

      const temp = document.createElement('textarea');

<script>
(function () {
  const SERAPHIM_API_URL = "https://script.google.com/macros/s/AKfycbycmOU171xQQmHO0OukmYE_053N4djoXwRM6jqhT2RhBC7J9uH6EF9hRxaSzd9yV6fo/exec";

  async function postToSheets(payload) {
    if (!SERAPHIM_API_URL || SERAPHIM_API_URL.includes("PASTE_")) return null;
    try {
      const res = await fetch(SERAPHIM_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    } catch (err) {
      console.warn("Seraphim sync warning:", err);
      return { status: "offline_or_cors", error: String(err) };
    }
  }

  async function fetchFromSheets(type) {
    if (!SERAPHIM_API_URL || SERAPHIM_API_URL.includes("PASTE_")) return [];
    try {
      const url = SERAPHIM_API_URL + "?type=" + encodeURIComponent(type) + "&t=" + Date.now();
      const res = await fetch(url);
      const json = await res.json();
      return json && json.status === "success" && Array.isArray(json.data) ? json.data : [];
    } catch (err) {
      console.warn("Seraphim fetch warning:", err);
      return [];
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve("");
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
document.addEventListener("click", async function (e) {
    const btn = e.target.closest("button, [role='button'], input[type='submit']");
    if (!btn) return;
    const btnText = (btn.innerText  btn.value  "").trim();
    if (!btnText.includes("إرسال طلب الانضمام")) return;

    const container = btn.closest("form, div.max-w-md, div.max-w-lg, div.max-w-xl, section, main") || document.body;
    const payload = { action: "register" };

    const inputs = container.querySelectorAll("input, select, textarea");
    for (const el of inputs) {
      if (el.type === "file") {
        if (el.files && el.files[0]) {
          payload.photoBase64 = await fileToBase64(el.files[0]);
          payload.photoName = el.files[0].name;
        }
        continue;
      }
      if (el.type === "radio" || el.type === "checkbox") {
        if (!el.checked) continue;
      }
      const box = el.closest("div");
      const labelText = box ? box.innerText.split("\n")[0].trim() : "";
      const key = labelText  el.placeholder  el.name  el.id  "field";
      payload[key] = el.value;
    }

    const activeGender = Array.from(container.querySelectorAll("button")).find(b =>
      (b.innerText.includes("ذكر") || b.innerText.includes("أنثى")) &&
      (b.className.includes("bg-")  b.getAttribute("aria-pressed") === "true"  b.dataset.active === "true")
    );
    if (activeGender) payload["النوع"] = activeGender.innerText.trim();

    postToSheets(payload);
  }, true);
  window.seraphimAPI = {
    url: SERAPHIM_API_URL,
    post: postToSheets,
    get: fetchFromSheets,
    fileToBase64: fileToBase64,
    register: (data) => postToSheets({ action: "register", ...data }),
    attendance: (data) => postToSheets({ action: "attendance", ...data }),
    exam: (data) => postToSheets({ action: "exam", ...data }),
    addBook: (data) => postToSheets({ action: "addBook", ...data }),
    sendNotification: (data) => postToSheets({ action: "sendNotification", ...data })
  };
})();
</script></body>
